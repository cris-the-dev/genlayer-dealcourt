name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/deal_court.py
      - run: pytest tests/direct/ -v
      - name: Direct tests against the deployed (shrunk) code
        run: |
          python deploy/shrink.py contracts/deal_court.py /tmp/deal_court.py --pack
          cp /tmp/deal_court.py contracts/deal_court.py
          pytest tests/direct/ -q
      - name: App controls per deal state and role
        run: node app/check-actions.mjs app/index.html
